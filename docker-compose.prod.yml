services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    ports:
      - "80:80"
    env_file: .env.api
    volumes:
      - app-storage:/var/www/bagisto/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smallplushies

  worker:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    command: runuser -u www-data -- php artisan queue:work redis --sleep=3 --tries=3 --timeout=60
    env_file: .env.api
    volumes:
      - app-storage:/var/www/bagisto/storage/app
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smallplushies

  mysql:
    image: mysql:8.0
    container_name: smallplushies-mysql
    env_file: .env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smallplushies

  redis:
    image: redis:7-alpine
    container_name: smallplushies-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - smallplushies

networks:
  smallplushies:
    name: smallplushies

volumes:
  app-storage:
  mysql-data:
  redis-data:
